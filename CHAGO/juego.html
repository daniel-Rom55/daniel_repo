<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zombie Forest 3D</title>
  <style>
    html, body {
      margin: 0;
      background: #0a0f12;
      color: white;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000;
      cursor: crosshair;
    }
    .hud {
      position: fixed;
      left: 20px;
      top: 20px;
      z-index: 10;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.5;
      text-shadow: 1px 1px 2px #000;
    }
    .message {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 9;
      font-size: 32px;
      font-weight: bold;
      display: none;
      text-shadow: 2px 2px 5px #000;
    }
    .controls {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      font-size: 14px;
      opacity: 0.9;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="hud" id="hud"></div>
  <div class="message" id="message"></div>
  <div class="controls">
    WASD / flechas: mover<br>
    Ratón: mirar<br>
    Click izquierdo: disparar<br>
    1/2: cambiar arma<br>
    R: recargar / reiniciar<br>
    ESC: salir
  </div>

  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const hud = document.getElementById("hud");
    const message = document.getElementById("message");

    const MAP = [
      "111111111111111",
      "100000000000001",
      "101111011111101",
      "100100000000001",
      "101101111011101",
      "100001000010001",
      "101101011110101",
      "100000010000001",
      "101111010111101",
      "100000000000001",
      "101011111011101",
      "100010000010001",
      "101110111110101",
      "100000000000001",
      "111111111111111"
    ];

    const FOV = Math.PI / 3.2;
    const MAX_DEPTH = 18;

    const weapons = {
      pistol: { damage: 35, cooldown: 0.38, reload: 1.1, mag: 12, reserve: 48 },
      rifle: { damage: 18, cooldown: 0.10, reload: 1.7, mag: 30, reserve: 90 }
    };

    const player = {
      x: 2.5,
      y: 2.5,
      angle: 0,
      health: 100,
      weapon: "pistol",
      reloadTimer: 0,
      lastShot: 0,
      score: 0
    };

    let zombies = [];
    let wave = 1;
    let gameOver = false;
    let respawnTimer = 0;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    function clamp(value, min, max) {
      return Math.max(min, Math.min(value, max));
    }

    function normalizeAngle(a) {
      while (a < -Math.PI) a += Math.PI * 2;
      while (a > Math.PI) a -= Math.PI * 2;
      return a;
    }

    function isWall(x, y) {
      if (x < 0 || y < 0) return true;
      const ix = Math.floor(x);
      const iy = Math.floor(y);
      if (iy < 0 || iy >= MAP.length) return true;
      if (ix < 0 || ix >= MAP[0].length) return true;
      return MAP[iy][ix] === "1";
    }

    function castRay(angle) {
      let dist = 0;
      while (dist < MAX_DEPTH) {
        const x = player.x + Math.cos(angle) * dist;
        const y = player.y + Math.sin(angle) * dist;
        if (isWall(x, y)) return { dist, x, y };
        dist += 0.02;
      }
      return { dist: MAX_DEPTH, x: null, y: null };
    }

    function spawnZombies(count) {
      const newZombies = [];
      let tries = 0;

      while (newZombies.length < count && tries < 500) {
        const x = 1.5 + Math.random() * 12;
        const y = 1.5 + Math.random() * 12;
        if (Math.hypot(x - player.x, y - player.y) > 3.0 && !isWall(x, y)) {
          newZombies.push({
            x, y,
            hp: 100,
            speed: 0.8 + Math.random() * 0.7,
            alive: true,
            attackCooldown: 0,
            hitFlash: 0
          });
        }
        tries++;
      }

      return newZombies;
    }

    function resetGame() {
      player.x = 2.5;
      player.y = 2.5;
      player.angle = 0;
      player.health = 100;
      player.weapon = "pistol";
      player.reloadTimer = 0;
      player.lastShot = 0;
      player.score = 0;

      weapons.pistol.mag = 12;
      weapons.pistol.reserve = 48;
      weapons.rifle.mag = 30;
      weapons.rifle.reserve = 90;

      wave = 1;
      respawnTimer = 0;
      zombies = spawnZombies(5);
      gameOver = false;
      message.style.display = "none";
    }

    function reloadWeapon() {
      if (player.reloadTimer > 0) return;
      const w = weapons[player.weapon];
      if (w.mag >= w.reserve && w.reserve === 0) return;
      if (w.mag >= 12 && player.weapon === "pistol") return;
      if (w.mag >= 30 && player.weapon === "rifle") return;
      const ammo = w.mag;
      const reserve = w.reserve;
      if (reserve <= 0) return;
      player.reloadTimer = weapons[player.weapon].reload;
    }

    function finishReload() {
      const w = weapons[player.weapon];
      const maxMag = player.weapon === "pistol" ? 12 : 30;

      const needed = maxMag - w.mag;
      if (needed > 0 && w.reserve > 0) {
        const used = Math.min(needed, w.reserve);
        w.mag += used;
        w.reserve -= used;
      }
    }

    function canShoot() {
      const now = performance.now() / 1000;
      return now - player.lastShot >= weapons[player.weapon].cooldown;
    }

    function fire() {
      if (gameOver) return;

      const w = weapons[player.weapon];
      if (player.reloadTimer > 0) return;
      if (w.mag <= 0) {
        reloadWeapon();
        return;
      }
      if (!canShoot()) return;

      w.mag -= 1;
      player.lastShot = performance.now() / 1000;

      const aimX = (canvas.width / 2 - canvas.width / 2) / canvas.width; // centro
      const aimY = (canvas.height / 2 - canvas.height / 2) / canvas.height; // centro
      const targetAngle = player.angle + (aimX * FOV * 1.3);

      let bestZombie = null;
      let bestDiff = Infinity;

      for (const z of zombies) {
        if (!z.alive) continue;
        const dx = z.x - player.x;
        const dy = z.y - player.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 8) continue;

        const ang = Math.atan2(dy, dx);
        const diff = Math.abs(normalizeAngle(ang - targetAngle));
        if (diff < bestDiff) {
          bestDiff = diff;
          bestZombie = z;
        }
      }

      if (bestZombie && bestDiff < 0.14) {
        bestZombie.hp -= weapons[player.weapon].damage;
        bestZombie.hitFlash = 0.18;
        if (bestZombie.hp <= 0) {
          bestZombie.alive = false;
          player.score += 10;
        }
      }

      if (w.mag === 0) {
        reloadWeapon();
      }
    }

    function updatePlayer(dt) {
      if (gameOver) return;

      let move = 0;
      let strafe = 0;

      const keys = {
        w: !!keysDown["KeyW"], a: !!keysDown["KeyA"], s: !!keysDown["KeyS"], d: !!keysDown["KeyD"],
        up: !!keysDown["ArrowUp"], down: !!keysDown["ArrowDown"], left: !!keysDown["ArrowLeft"], right: !!keysDown["ArrowRight"]
      };

      if (keys.w || keys.up) move += 1;
      if (keys.s || keys.down) move -= 1;
      if (keys.d || keys.right) strafe += 1;
      if (keys.a || keys.left) strafe -= 1;

      const speed = 2.8 * dt;

      const forwardX = Math.cos(player.angle) * move * speed;
      const forwardY = Math.sin(player.angle) * move * speed;
      const sideX = Math.cos(player.angle + Math.PI / 2) * strafe * speed;
      const sideY = Math.sin(player.angle + Math.PI / 2) * strafe * speed;

      const nx = player.x + forwardX + sideX;
      const ny = player.y + forwardY + sideY;

      if (!isWall(nx, player.y)) player.x = nx;
      if (!isWall(player.x, ny)) player.y = ny;

      if (player.reloadTimer > 0) {
        player.reloadTimer -= dt;
        if (player.reloadTimer <= 0) {
          finishReload();
        }
      }
    }

    function updateZombies(dt) {
      let aliveCount = 0;

      for (const z of zombies) {
        if (!z.alive) continue;
        aliveCount++;

        z.hitFlash = Math.max(0, z.hitFlash - dt);

        const dx = player.x - z.x;
        const dy = player.y - z.y;
        let dist = Math.hypot(dx, dy);
        if (dist < 0.001) dist = 0.001;

        if (dist > 1.1) {
          const step = z.speed * dt;
          const nx = z.x + (dx / dist) * step;
          const ny = z.y + (dy / dist) * step;
          if (!isWall(nx, z.y)) z.x = nx;
          if (!isWall(z.x, ny)) z.y = ny;
        }

        if (dist < 1.15) {
          z.attackCooldown -= dt;
          if (z.attackCooldown <= 0) {
            player.health -= 13;
            z.attackCooldown = 0.9;
            if (player.health <= 0) {
              player.health = 0;
              gameOver = true;
              message.textContent = "DERROTADO";
              message.style.display = "block";
            }
          }
        }
      }

      if (aliveCount === 0) {
        if (respawnTimer <= 0) respawnTimer = 2.5;
        respawnTimer -= dt;
        if (respawnTimer <= 0) {
          wave += 1;
          zombies = zombies.concat(spawnZombies(4 + wave));
          respawnTimer = 0;
        }
      }
    }

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.5);
      sky.addColorStop(0, "#6ea8d8");
      sky.addColorStop(1, "#d9d5b3");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height / 2);

      const ground = ctx.createLinearGradient(0, canvas.height / 2, 0, canvas.height);
      ground.addColorStop(0, "#2a3a2f");
      ground.addColorStop(1, "#111811");
      ctx.fillStyle = ground;
      ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);

      // árboles de fondo
      for (let i = 0; i < 22; i++) {
        const x = (i * 120 + 30 + (wave * 10)) % (canvas.width + 120) - 50;
        const y = 150 + (i % 4) * 30;
        ctx.fillStyle = "#191d1a";
        ctx.fillRect(x + 12, y + 25, 18, 90);
        ctx.beginPath();
        ctx.fillStyle = "#1d512f";
        ctx.arc(x + 20, y, 32, 0, Math.PI * 2);
        ctx.arc(x - 5, y + 12, 26, 0, Math.PI * 2);
        ctx.arc(x + 38, y + 10, 28, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawWorld() {
      drawBackground();

      const wallColors = [];
      for (let col = 0; col < canvas.width; col += 2) {
        const rayAngle = player.angle - FOV / 2 + (col / canvas.width) * FOV;
        const hit = castRay(rayAngle);
        const corrected = hit.dist * Math.cos(rayAngle - player.angle);

        const wallHeight = clamp(canvas.height / corrected, 20, 2000);
        const top = (canvas.height - wallHeight) / 2;

        let shade = clamp(255 * (1 - corrected / MAX_DEPTH), 35, 220);
        const c = [
          shade,
          Math.round(shade * 0.78),
          Math.round(shade * 0.55)
        ];
        ctx.fillStyle = `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
        ctx.fillRect(col, top, 2, wallHeight);

        wallColors.push({ col, top, wallHeight });
      }

      const visibles = [];
      for (const z of zombies) {
        if (!z.alive) continue;
        const dx = z.x - player.x;
        const dy = z.y - player.y;
        const dist = Math.hypot(dx, dy);
        const ang = Math.atan2(dy, dx);
        const diff = normalizeAngle(ang - player.angle);

        if (Math.abs(diff) < FOV * 0.9 && dist < MAX_DEPTH) {
          visibles.push({ dist, diff, z });
        }
      }

      visibles.sort((a, b) => b.dist - a.dist);

      for (const { dist, diff, z } of visibles) {
        const screenX = canvas.width / 2 + (diff / FOV) * canvas.width;
        const size = clamp((canvas.height / dist) * 0.85, 20, 300);
        const screenY = canvas.height / 2 + size * 0.12;

        const rectW = size * 0.55;
        const rectH = size * 1.5;
        const rectX = screenX - rectW / 2;
        const rectY = screenY - rectH * 0.8;

        const bodyColor = z.hitFlash > 0 ? "#ff7d7d" : "#3ca96a";
        ctx.fillStyle = bodyColor;
        ctx.fillRect(rectX, rectY, rectW, rectH);

        ctx.fillStyle = "#101010";
        ctx.beginPath();
        ctx.arc(screenX, screenY - size * 0.7, size * 0.18, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ff4d4d";
        ctx.fillRect(rectX, rectY - 10, rectW * (z.hp / 100), 6);
      }
    }

    function drawMinimap() {
      const size = 180;
      const x = 20;
      const y = canvas.height - size - 20;

      ctx.strokeStyle = "rgba(255,255,255,0.7)";
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, size, size);

      const cell = size / MAP[0].length;
      for (let j = 0; j < MAP.length; j++) {
        for (let i = 0; i < MAP[j].length; i++) {
          if (MAP[j][i] === "1") {
            ctx.fillStyle = "#6f6f6f";
            ctx.fillRect(x + i * cell, y + j * cell, cell, cell);
          }
        }
      }

      ctx.fillStyle = "#5ec9ff";
      ctx.beginPath();
      ctx.arc(x + player.x * cell, y + player.y * cell, 5, 0, Math.PI * 2);
      ctx.fill();

      for (const z of zombies) {
        if (z.alive) {
          ctx.fillStyle = "#ff4d4d";
          ctx.beginPath();
          ctx.arc(x + z.x * cell, y + z.y * cell, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawHud() {
      const weaponText = player.weapon.toUpperCase();
      const ammo = weapons[player.weapon].mag;
      const reserve = weapons[player.weapon].reserve;

      hud.innerHTML = `
        HP: ${Math.max(0, Math.round(player.health))}<br>
        ARMA: ${weaponText}<br>
        MUNICIÓ: ${ammo} / ${reserve}<br>
        PUNTOS: ${player.score}<br>
        OLA: ${wave}
      `;

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2 - 12, canvas.height / 2);
      ctx.lineTo(canvas.width / 2 + 12, canvas.height / 2);
      ctx.moveTo(canvas.width / 2, canvas.height / 2 - 12);
      ctx.lineTo(canvas.width / 2, canvas.height / 2 + 12);
      ctx.stroke();

      if (player.reloadTimer > 0) {
        ctx.fillStyle = "rgba(255, 210, 100, 0.85)";
        ctx.font = "bold 26px Arial";
        ctx.fillText("RECARGANDO...", canvas.width / 2 - 130, canvas.height - 40);
      }
    }

    const keysDown = {};

    document.addEventListener("keydown", (e) => {
      keysDown[e.code] = true;

      if (e.code === "Digit1") player.weapon = "pistol";
      if (e.code === "Digit2") player.weapon = "rifle";
      if (e.code === "KeyR") {
        if (gameOver) resetGame();
        else reloadWeapon();
      }
    });

    document.addEventListener("keyup", (e) => {
      keysDown[e.code] = false;
    });

    canvas.addEventListener("mousedown", (e) => {
      if (e.button === 0) fire();
    });

    document.addEventListener("mousemove", (e) => {
      if (document.pointerLockElement === canvas) {
        player.angle += e.movementX * 0.0025;
      }
    });

    canvas.addEventListener("click", () => {
      canvas.requestPointerLock();
    });

    resetGame();

    let lastTime = performance.now();
    function loop(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      if (!gameOver) {
        updatePlayer(dt);
        updateZombies(dt);
      }

      drawWorld();
      drawMinimap();
      drawHud();

      if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
